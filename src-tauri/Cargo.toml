[package]
name = "viacomponentis"
version = "0.1.0"
description = "Personal React 19 + TypeScript Learning Roadmap styled as a Monochrome Cyberspace Neural OS"
authors = ["projectGloria"]
edition = "2021"

[[bin]]
name = "viaComponentis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
